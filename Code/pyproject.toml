[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "op0"
version = "0.1.0"
description = "op0: minimal Pi-runtime execution base (L0 clean base)."
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
op0 = "op0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
